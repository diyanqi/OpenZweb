name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.7). Leave empty to build artifact only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          echo "Installed Xcode apps:"
          ls /Applications | grep -i Xcode || true
          CANDIDATES=(
            /Applications/Xcode_26.2.app
            /Applications/Xcode_26.1.app
            /Applications/Xcode_26.0.app
            /Applications/Xcode_26.app
            /Applications/Xcode.app
          )
          SELECTED=""
          for app in "${CANDIDATES[@]}"; do
            if [ -d "$app/Contents/Developer" ]; then
              VER=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 || true)
              echo "Candidate $app -> $VER"
              if echo "$VER" | grep -Eq 'Xcode 26(\.|$)'; then
                SELECTED="$app/Contents/Developer"
                break
              fi
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "::error::Xcode 26.x is required for this project. None found on the runner."
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              "$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null || true
            done
            exit 1
          fi
          echo "Using $SELECTED"
          sudo xcode-select -s "$SELECTED"
          xcodebuild -version
          swift --version
          MAJOR=$(xcodebuild -version | awk '/Xcode/{print $2}' | cut -d. -f1)
          test "$MAJOR" = "26"

      - name: Download universal zju-connect (arm64 + x86_64)
        env:
          ZJU_CONNECT_TAG: v1.2.1
        run: |
          set -euo pipefail
          chmod +x Scripts/download-core.sh Scripts/download-core-universal.sh
          ./Scripts/download-core-universal.sh
          file Core/zju-connect
          lipo -info Core/zju-connect
          test -x Core/zju-connect

      - name: Build OpenZweb.app (universal Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -project OpenZweb.xcodeproj \
            -scheme OpenZweb \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP="build/Build/Products/Release/OpenZweb.app"
          test -d "$APP"
          if [ ! -x "$APP/Contents/Resources/Core/zju-connect" ]; then
            echo "Core engine missing from app bundle" >&2
            find "$APP/Contents" -name 'zju-connect' -o -type d -name Core | head -50
            exit 1
          fi
          file "$APP/Contents/MacOS/OpenZweb"
          file "$APP/Contents/Resources/Core/zju-connect"
          lipo -info "$APP/Contents/MacOS/OpenZweb" || true
          lipo -info "$APP/Contents/Resources/Core/zju-connect" || true
          xattr -cr "$APP" || true
          if [ -x "$APP/Contents/Resources/Core/zju-connect" ]; then
            codesign --force --sign - --timestamp=none "$APP/Contents/Resources/Core/zju-connect" || true
          fi
          codesign --force --deep --sign - --timestamp=none "$APP" || true
          codesign --verify --verbose=1 "$APP" || true

      - name: Package DMG
        run: |
          set -euo pipefail
          chmod +x Scripts/package-dmg.sh
          VERSION="${GITHUB_REF_NAME:-}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          ./Scripts/package-dmg.sh \
            --app "build/Build/Products/Release/OpenZweb.app" \
            --version "$VERSION" \
            --out "dist"
          ls -lah dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenZweb-dmg
          path: dist/*.dmg

      - name: Create GitHub Release (Actions only)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          # Normalize tag (accept v1.0.8 or 1.0.8)
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi
          ls -lah dist || true
          if ! ls dist/*.dmg >/dev/null 2>&1; then
            echo "No DMG artifacts in dist/" >&2
            exit 1
          fi
          # Single universal DMG (arm64 + x86_64) — name ends with macos-universal.dmg
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Release publish attempt $attempt for $TAG"
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" dist/*.dmg --clobber; then
                gh release edit "$TAG" --draft=false --title "OpenZweb $TAG" || true
                echo "Uploaded assets to existing release $TAG"
                gh release view "$TAG" --json assets --jq '.assets[].name'
                exit 0
              fi
            else
              # Prefer --verify-tag when the tag is on the remote; fall back without it
              # (workflow_dispatch / race right after git push --tags).
              if gh release create "$TAG" dist/*.dmg \
                  --title "OpenZweb $TAG" \
                  --generate-notes \
                  --verify-tag; then
                echo "Created release $TAG (verified tag)"
                gh release view "$TAG" --json assets --jq '.assets[].name'
                exit 0
              fi
              if gh release create "$TAG" dist/*.dmg \
                  --title "OpenZweb $TAG" \
                  --generate-notes \
                  --target "$GITHUB_SHA"; then
                echo "Created release $TAG (target SHA fallback)"
                gh release view "$TAG" --json assets --jq '.assets[].name'
                exit 0
              fi
            fi
            sleep $((attempt * 8))
          done
          echo "Failed to publish release after retries" >&2
          exit 1
